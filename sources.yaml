# Every signal the ranking reads. Weights are editorial and public.
# Adding a source is one entry here plus its observations in an update.
- id: clarivate
  name: Clarivate Citation Laureates
  url: https://clarivate.com/citation-laureates/economics/
  kind: named
  weight: 3
  blurb: The strongest quantitative predictor. Each September Clarivate names a handful of economists whose citation records look Nobel-class. Dozens of past picks have gone on to win, often years later.
- id: clarivate-alumni
  name: Clarivate alumni (prior years)
  url: https://en.wikipedia.org/wiki/List_of_Clarivate_Citation_laureates_in_Economic_Sciences
  kind: named
  weight: 1
  blurb: Everyone Clarivate named in an earlier year who has not won yet. Still a real signal, since most Citation Laureates who win do so years after being named, but a weaker one than this year's list.
- id: polymarket
  name: Polymarket
  url: https://polymarket.com
  kind: prob
  weight: 3
  blurb: A prediction market with real money on it. No 2026 Economics Nobel market as of Sept 20; its Peace and Literature markets open much earlier than economics. Enters the board when it lists one.
- id: kalshi
  name: Kalshi
  url: https://kalshi.com/markets/kxnobelecon/nobel-economics-prize/kxnobelecon-26
  kind: prob
  weight: 3
  blurb: A regulated US prediction market. Its 2026 Economics Nobel market opened July 1 with nine names. We record the price Kalshi displays, the last trade, and fall back to the midpoint of the best yes bid and ask for contracts that have never traded. Bid and ask ride in the note, since the book is thin. Kept separate from Polymarket so the two can disagree in public.
- id: ladbrokes
  name: Ladbrokes
  url: https://www.ladbrokes.com
  kind: prob
  weight: 2
  blurb: Bookmaker odds, converted to an implied probability. Bookmakers price to balance their book, not to be right, so they carry less weight than a market.
- id: marginal-revolution
  name: Marginal Revolution
  url: https://marginalrevolution.com
  kind: rank
  weight: 1.5
  blurb: Tyler Cowen's annual picks, in his order. One well-read economist's judgment, published before the announcement every year.
- id: hse
  name: HSE prediction contest
  url: https://www.hse.ru
  kind: share
  weight: 1
  blurb: HSE University's annual open prediction contest. Aggregates informed opinion, reported as shares of entries.
- id: kmikeym
  name: KmikeyM desk
  url: /updates/
  kind: named
  weight: 0.5
  blurb: Our own calls. Deliberately light, so the desk can flag a sleeper without bending the board.
